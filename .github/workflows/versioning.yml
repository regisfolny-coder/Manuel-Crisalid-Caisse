name: Auto Update Frontmatter Date

on:
  push:
    paths:
      - '**.md'

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mettre à jour updated_at dans les fichiers .md modifiés
        run: |
          # Récupère la date du jour au format AAAA-MM-JJ
          TODAY=$(date +'%Y-%m-%d')
          
          # Identifie les fichiers .md modifiés lors du dernier commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.md$' || true)
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              # Remplace la ligne updated_at: ... par la date courante
              sed -i "s/^updated_at:.*/updated_at: $TODAY/" "$file"
            fi
          done

      - name: Commit et Push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          # Commit uniquement s'il y a des changements
          git diff-index --quiet HEAD || git commit -m "chore(doc): mise à jour auto de la date [skip ci]"
          git push
