name: Auto Update Documentation Metadata

on:
  push:
    paths:
      - '**.md'

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mettre à jour mis_a_jour_le et version dans les fichiers .md
        run: |
          # 1. Date du jour au format AAAA-MM-JJ
          TODAY=$(date +'%Y-%m-%d')
          
          # 2. Récupération du message du dernier commit
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # 3. Extraction de la version si taguée sous forme [v1.2] dans le commit
          NEW_VERSION=$(echo "$COMMIT_MSG" | grep -oP '\[v\K[0-9]+\.[0-9]+\]' | tr -d ']' || true)
          
          # 4. Liste des fichiers .md modifiés dans le dernier commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.md$' || true)
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              # Remplace la date en ciblant la clé française
              sed -i "s/^mis_a_jour_le:.*/mis_a_jour_le: $TODAY/" "$file"
              
              # Si un tag [vX.X] est présent dans le commit, mise à jour de la version
              if [ -n "$NEW_VERSION" ]; then
                sed -i "s/^version:.*/version: \"$NEW_VERSION\"/" "$file"
              fi
            fi
          done

      - name: Commit et Push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff-index --quiet HEAD || git commit -m "chore(doc): mise à jour auto des métadonnées [skip ci]"
          git push
